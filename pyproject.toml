[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "polymarket-bot-ml"
version         = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.3",
    "hmmlearn>=0.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "web3>=6.15",
    "websockets>=12",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "sqlalchemy>=2.0",
    "rich>=13",
    "click>=8",
    "torch>=2.2",
    "transformers>=4.38",
    "pydantic>=2.0",
]

[tool.setuptools.package-dir]
"" = "python-ml"

[tool.setuptools.packages.find]
where = ["python-ml"]
