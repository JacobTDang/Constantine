[package]
name = "polymarket-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "polymarket-bot"
path = "rust-core/src/main.rs"

[dependencies]
tokio             = { version = "1",    features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util      = "0.3"
serde             = { version = "1",    features = ["derive"] }
serde_json        = "1"
reqwest           = { version = "0.12", features = ["json", "native-tls"] }
crossbeam         = "0.8"
dashmap           = "5"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy           = "0.15"
anyhow            = "1"
thiserror         = "1"
chrono            = { version = "0.4",  features = ["serde"] }
rust_decimal      = { version = "1",    features = ["serde-with-str"] }
uuid              = { version = "1",    features = ["v4"] }
memmap2           = "0.9"

# Pure-Rust crypto for EIP-712 signing + L2 auth headers (no gcc needed)
k256              = { version = "0.13", features = ["ecdsa", "sha2"] }
tiny-keccak       = { version = "2.0",  features = ["keccak"] }
hmac              = "0.12"
sha2              = "0.10"
hex               = "0.4"
base64            = "0.22"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
